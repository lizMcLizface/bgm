[package]
name = "calmbgm_fm"
version = "0.1.0"
edition = "2021"
license = "MIT"
[lib]
crate-type = ["cdylib", "rlib"]
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
profile-sections = []
# Exact coefficient reuse. Uncached ABI reference: --no-default-features --features legacy-abi.
cache-colour-coefficients = []
legacy-abi = []
default = ["cache-colour-coefficients", "legacy-abi"]

# Experimental explicit Wasm SIMD128 voice batching; requires a separate SIMD build.
simd-voices = []

# Experimental multi-output FM bank; never enabled in ordinary kernels.
multitimbral = ["simd-voices"]
simd-colour = []
