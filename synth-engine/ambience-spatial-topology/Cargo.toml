[package]
name="calmbgm_ambience_spatial_topology"
version="0.1.0"
edition="2021"
license="MIT"
build="build.rs"
[lib]
crate-type=["cdylib","rlib"]
[dependencies]
calmbgm_native_wave_preparation={path="../native-wave-preparation",default-features=false}
[features]
default=["live-resources"]
live-resources=[]
allocation-audit=[]
[profile.release]
opt-level=3
lto=true
codegen-units=1
panic="abort"
strip=true
