<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rack dynamics actual hosts</title><style>body{font:16px system-ui;max-width:900px;margin:24px auto;padding:12px;background:#171b20;color:#eee}button,select{font:inherit;padding:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{cursor:pointer}</style><h1>Rack dynamics actual hosts</h1><p>Muted Native/owned comparison through the existing workbench and Classics external racks. Fixed bounds; stereo source, both serial/parallel swaps. This page does not assess physical device output.</p><label>Rate <select id="rate"><option>8000</option><option>24000</option><option>44100</option><option selected>48000</option><option>96000</option><option>192000</option></select></label> <button id="run">Run three host comparisons</button><p id="status">Ready</p><pre id="report"></pre><script type="module">
import{runRackDynamicsHosts}from'./rackDynamicsHostBatch.js?review=hosts2';const $=id=>document.getElementById(id);const query=new URLSearchParams(location.search),rate=Number(query.get('rate'));if([8000,24000,44100,48000,96000,192000].includes(rate))$('rate').value=rate;$('run').onclick=async()=>{$('run').disabled=true;try{const r=await runRackDynamicsHosts(text=>$('status').textContent=text,{rate:Number($('rate').value),onCheckpoint:r=>$('report').textContent=JSON.stringify(r,null,2)});$('report').textContent=JSON.stringify(r,null,2);$('status').textContent=r.checksPassed?'All three host comparisons passed':'Host comparison failed';}catch(e){$('report').textContent=JSON.stringify({error:String(e),stack:e.stack},null,2);$('status').textContent='Failed';}finally{$('run').disabled=false;}};
</script></html>
