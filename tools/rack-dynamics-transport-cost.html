<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Native metadata transport cost</title><style>body{font:16px system-ui;max-width:900px;margin:24px auto;padding:12px}button{font:inherit;padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Native metadata transport cost</h1><p>Eight muted short synthetic contexts compare original and stamped Native AudioParam descriptor overhead. Reported wall time and supplied array bytes do not establish physical deadlines or total native memory.</p><button id="run">Run eight cost comparisons</button><p id="status">Ready</p><pre id="report"></pre><script type="module">import{runTransportCost}from'./rackDynamicsTransportCostBatch.js?review=cost1';const $=id=>document.getElementById(id);$('run').onclick=async()=>{$('run').disabled=true;try{const report=await runTransportCost(t=>$('status').textContent=t);$('report').textContent=JSON.stringify(report,null,2);$('status').textContent=report.checksPassed?'Eight comparisons completed':'Checks failed';}catch(e){$('report').textContent=JSON.stringify({error:String(e),stack:e.stack},null,2);}finally{$('run').disabled=false;}};</script></html>
