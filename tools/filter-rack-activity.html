<!doctype html><html><head><meta charset="utf-8"><title>Filter activity admission</title></head><body><h1>Filter activity admission</h1><p>Explicit caller activity contracts; no environment selection. Two muted native comparisons and refusal-before-mutation checks.</p><button id="run">Run eight admission checks</button><p id="status">Ready</p><textarea id="report" style="width:96%;height:70vh" readonly></textarea><script type="module">import{runFilterRackActivityReview}from'./filterRackActivityReview.js';const run=document.querySelector('#run'),status=document.querySelector('#status'),report=document.querySelector('#report');run.onclick=async()=>{run.disabled=true;try{const r=await runFilterRackActivityReview(s=>status.textContent=s);report.value=JSON.stringify(r,null,2);status.textContent=r.checksPassed?'Checks passed':'Checks failed';}catch(e){status.textContent=String(e);}finally{run.disabled=false;}};</script></body></html>
